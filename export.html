<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescate de datos Forge → BULK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,'Barlow',sans-serif;
     background:#0a0505;color:#e8dcdc;padding:20px;min-height:100vh;line-height:1.5}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:22px;letter-spacing:1px;text-transform:uppercase;color:#e53935;margin-bottom:4px}
.sub{color:#8a6060;font-size:13px;margin-bottom:22px}
.card{background:#140a0a;border:1px solid #3a1818;border-radius:8px;padding:16px;margin-bottom:14px}
.card h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a6060;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #241010;font-size:14px}
.row:last-child{border-bottom:none}
.row b{color:#ff5252;font-variant-numeric:tabular-nums}
button{width:100%;padding:15px;border:none;border-radius:8px;background:#c62828;color:#fff;
       font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
       cursor:pointer;margin-bottom:10px;font-family:inherit}
button:active{background:#8e1f1f}
button.ghost{background:transparent;border:1px solid #4d2020;color:#e8dcdc}
textarea{width:100%;height:170px;background:#0a0505;color:#8a6060;border:1px solid #3a1818;
         border-radius:6px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         font-size:10px;resize:vertical}
.ok{color:#4caf50}.bad{color:#ff5252}.warn{color:#e0a030}
.note{font-size:12px;color:#5c3838;margin-top:14px}
code{background:#1c0e0e;padding:1px 5px;border-radius:3px;color:#b58080;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rescate de datos</h1>
  <div class="sub">Forge &rarr; BULK &middot; solo lectura, no modifica nada</div>
  <div id="status" class="card">Leyendo IndexedDB <code>forge3</code>&hellip;</div>
  <div id="actions"></div>
  <div class="note">
    Esta p&aacute;gina <b>nunca escribe</b> en la base de datos de Forge. Solo lee la clave
    <code>state3</code> y te la entrega. Tu historial en Forge queda intacto.
  </div>
</div>

<script>
var S = document.getElementById('status');
var A = document.getElementById('actions');
var PAYLOAD = null;

function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function fail(msg, hint){
  S.innerHTML = '<h2>Resultado</h2><div class="bad"><b>' + esc(msg) + '</b></div>' +
                (hint ? '<div class="note">' + hint + '</div>' : '');
}

function read(){
  if(!('indexedDB' in window)) return fail('Este navegador no soporta IndexedDB.');

  var created = false, settled = false;
  var done = function(){ settled = true; };

  // Si nada responde en 8s, no dejamos la pantalla colgada en "Leyendo...".
  setTimeout(function(){
    if(!settled){
      fail('La base de datos no respondi&oacute;.',
           'Suele pasar si otra pesta&ntilde;a con Forge abierta est&aacute; bloqueando la conexi&oacute;n. ' +
           'Cierra las dem&aacute;s pesta&ntilde;as de Forge y recarga esta p&aacute;gina.');
    }
  }, 8000);

  var req;
  try{
    req = indexedDB.open('forge3', 1);
  }catch(err){
    done();
    return fail('Este navegador bloque&oacute; el acceso a IndexedDB.',
      'Ocurre cuando la p&aacute;gina se abre con doble clic (<code>file://</code>) o desde un <code>data:</code> URL, ' +
      'porque el navegador la trata como un origen sin permisos de almacenamiento. ' +
      'Sube este archivo a la misma web donde corre Forge y &aacute;brelo como <code>https://.../FORGE/export.html</code>.');
  }

  req.onupgradeneeded = function(){ created = true; };

  req.onerror = function(){
    done();
    fail('No se pudo abrir la base de datos.',
         'Si est&aacute;s en modo inc&oacute;gnito o con los datos de sitio bloqueados, abre esta p&aacute;gina en una ventana normal.');
  };

  req.onsuccess = function(e){
    done();
    var db = e.target.result;

    if(created || !db.objectStoreNames.contains('kv')){
      db.close();
      if(created){ try{ indexedDB.deleteDatabase('forge3'); }catch(_){} }
      return fail('No hay datos de Forge en este origen.',
        'IndexedDB es por <b>origen</b> (dominio). Abre esta misma p&aacute;gina en el navegador y dominio exactos donde usas Forge, normalmente el celular, en <code>' +
        esc(location.origin) + '/FORGE/export.html</code>. Si abriste el archivo con doble clic (<code>file://</code>) no puede ver los datos.');
    }

    var tx = db.transaction('kv', 'readonly');
    var get = tx.objectStore('kv').get('state3');

    get.onerror = function(){ db.close(); fail('Error leyendo la clave state3.'); };

    get.onsuccess = function(){
      var data = get.result;
      db.close();
      if(!data){
        return fail('La base existe pero state3 est&aacute; vac&iacute;a.',
                    'Puede ser un navegador donde abriste Forge pero nunca registraste nada.');
      }
      report(data);
    };
  };
}

function report(data){
  var logs = data.logs || {};
  var keys = Object.keys(logs).sort();
  var completed = keys.filter(function(k){ return logs[k] && logs[k].completed; });

  var sets = 0, secs = 0;
  completed.forEach(function(k){
    var s = logs[k].session || {};
    sets += Object.keys(s).length;
    secs += (logs[k].durSecs || 0);
  });

  var dietDays = Object.keys(data.dietLog || {}).length;
  var pending  = Object.keys(data.session || {}).length;

  PAYLOAD = {
    source: 'forge3/state3',
    exportedAt: new Date().toISOString(),
    origin: location.origin,
    userAgent: navigator.userAgent,
    state: data
  };

  var rows = [
    ['Sesiones completadas', completed.length],
    ['Series registradas', sets],
    ['Primera sesión', completed[0] || '—'],
    ['Última sesión', completed[completed.length - 1] || '—'],
    ['Tiempo total en el gym', Math.round(secs / 3600) + ' h'],
    ['XP total', data.totalXP || 0],
    ['Días de dieta guardados', dietDays],
    ['Series de sesión en curso', pending]
  ];

  S.innerHTML = '<h2>Datos encontrados</h2>' + rows.map(function(r){
    return '<div class="row"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>';
  }).join('');

  if(dietDays === 0){
    S.innerHTML += '<div class="note warn">Nota: Forge ten&iacute;a un bug que imped&iacute;a releer el ' +
                   'registro de dieta desde disco, as&iacute; que es normal ver 0 aqu&iacute;. ' +
                   'El historial de entrenamientos <b>no</b> estaba afectado.</div>';
  }

  A.innerHTML =
    '<button id="dl">Descargar JSON</button>' +
    '<button id="cp" class="ghost">Copiar al portapapeles</button>' +
    '<div class="card"><h2>Contenido (por si necesitas pegarlo a mano)</h2>' +
    '<textarea id="ta" readonly></textarea></div>';

  var json = JSON.stringify(PAYLOAD, null, 2);
  document.getElementById('ta').value = json;

  document.getElementById('dl').onclick = function(){
    var name = 'forge-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    var blob = new Blob([json], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    this.textContent = 'Descargado ✓';
  };

  document.getElementById('cp').onclick = function(){
    var btn = this;
    var done = function(){ btn.textContent = 'Copiado ✓'; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(done, function(){ manual(btn); });
    } else {
      manual(btn);
    }
  };

  function manual(btn){
    var ta = document.getElementById('ta');
    ta.removeAttribute('readonly');
    ta.select();
    ta.setSelectionRange(0, json.length);
    try{
      document.execCommand('copy');
      btn.textContent = 'Copiado ✓';
    }catch(_){
      btn.textContent = 'Copia manual desde el cuadro';
    }
    ta.setAttribute('readonly', '');
  }
}

read();
</script>
</body>
</html>
